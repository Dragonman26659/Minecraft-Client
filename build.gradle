plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fukntclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

// Loom inspects file dependencies while the project is being configured. A task-based
// download runs too late and produces "Failed to compute checksum" for a missing file.
// Resolve the official release before declaring the file dependency so this works on
// clean Windows/macOS/Linux checkouts without a machine-specific absolute path.
def baritoneVersion = project.findProperty("baritone_version") ?: "1.16.0"
def baritoneFileName = "baritone-api-fabric-${baritoneVersion}.jar"
def baritoneJar = layout.projectDirectory.file("libs/${baritoneFileName}").asFile

def ensureBaritoneDownloaded = {
    if (!baritoneJar.isFile() || baritoneJar.length() < 100000L) {
        baritoneJar.parentFile.mkdirs()
        def url = new URL("https://github.com/cabaletta/baritone/releases/download/v${baritoneVersion}/${baritoneFileName}")
        logger.lifecycle("Downloading official Baritone Fabric ${baritoneVersion} dependency...")
        def connection = url.openConnection()
        connection.connectTimeout = 20000
        connection.readTimeout = 90000
        connection.setRequestProperty("User-Agent", "FukntClient-Gradle")
        File temporary = new File(baritoneJar.parentFile, baritoneFileName + ".part")
        try {
            connection.getInputStream().withCloseable { input ->
                temporary.withOutputStream { output -> input.transferTo(output) }
            }
            if (temporary.length() < 100000L) {
                throw new GradleException("Downloaded Baritone file is unexpectedly small (${temporary.length()} bytes). Check the release URL/version.")
            }
            if (baritoneJar.exists()) baritoneJar.delete()
            if (!temporary.renameTo(baritoneJar)) {
                throw new GradleException("Could not move downloaded Baritone jar into ${baritoneJar}")
            }
        } catch (Exception ex) {
            temporary.delete()
            throw new GradleException("Could not download Baritone ${baritoneVersion}. Check your internet connection and the official release URL.", ex)
        }
    }
}

ensureBaritoneDownloaded()

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'

	implementation 'org.reflections:reflections:0.10.2'
	include 'org.reflections:reflections:0.10.2'

	// Baritone is downloaded automatically and nested as a Fabric mod dependency.
	// Its Fabric metadata is retained, so Fabric Loader discovers and initialises it.
	modImplementation files(baritoneJar)
	include files(baritoneJar)

	// Baritone's nested nether-pathfinder jar is NOT loaded in the dev environment
	// (Loom ignores jars nested inside a file dependency), which caused
	// NoClassDefFoundError: dev/babbaj/pathfinder/NetherPathfinder on startup.
	modImplementation files('libs/nether-pathfinder-1.6.jar')
	include files('libs/nether-pathfinder-1.6.jar')

	implementation 'org.javassist:javassist:3.29.2-GA'
	include 'org.javassist:javassist:3.29.2-GA'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Bytecode target stays at 21 (what Minecraft 1.21.10 ships with) even though
	// the JDK doing the compiling/running is 26. Keeps Mixin/ASM happy.
	it.options.release = 21
}

java {
	// Build and run with JDK 26.
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}

	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Loom's runClient task is a JavaExec task. Explicitly select the Java 26 launcher.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}