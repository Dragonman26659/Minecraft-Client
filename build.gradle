plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fukntclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

def baritoneVersion = project.findProperty("baritone_version") ?: "1.16.0"
def baritoneFileName = "baritone-api-fabric-${baritoneVersion}.jar"
def baritoneJar = layout.projectDirectory.file("libs/${baritoneFileName}").asFile
def baritoneDownloadUrl = "https://github.com/cabaletta/baritone/releases/download/v${baritoneVersion}/${baritoneFileName}"

tasks.register("downloadBaritone") {
	group = "build setup"
	description = "Downloads the matching official Baritone Fabric API jar."
	outputs.file(baritoneJar)
	doLast {
		if (!baritoneJar.exists()) {
			baritoneJar.parentFile.mkdirs()
			logger.lifecycle("Downloading Baritone ${baritoneVersion} for Fabric...")
			new URL(baritoneDownloadUrl).with { url ->
				URLConnection connection = url.openConnection()
				connection.connectTimeout = 15000
				connection.readTimeout = 60000
				connection.getInputStream().withCloseable { input ->
					baritoneJar.withOutputStream { output -> output << input }
				}
			}
		}
	}
}

tasks.configureEach {
	if (name in ["compileJava", "compileClientJava", "jar", "remapJar"]) {
		dependsOn(tasks.named("downloadBaritone"))
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	implementation 'org.reflections:reflections:0.10.2'
	include 'org.reflections:reflections:0.10.2'

	// Baritone is downloaded automatically and nested as a Fabric mod dependency.
	// Its Fabric metadata is retained, so Fabric Loader discovers and initialises it.
	modImplementation files(baritoneJar)
	include files(baritoneJar)

	implementation 'org.javassist:javassist:3.29.2-GA'
	include 'org.javassist:javassist:3.29.2-GA'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}